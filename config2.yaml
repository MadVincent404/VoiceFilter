sample_rate: 16000
segment_length: 3.0
n_fft: 512
hop_length: 128
win_length: 512

d_vec_size: 192
lstm_hidden: 400
lstm_layers: 1
fc_hidden: 600
dropout: 0.0

epochs: 120
batch_size: 48
lr: 0.00003
grad_clip: 5.0
num_workers: 8
log_interval: 100
num_mixes: 2
snr_min: -5.0
snr_max:  5.0
weight_decay: 0.0001

train_splits:
  - train-other-500
  - train-clean-100

librispeech_root: "/workspace/data/LibriSpeech"
d_vec_path: "/workspace/data/d_vectors.pt"
checkpoint_dir: "checkpoints_v5"
log_dir: "checkpoints_v5/logs"
tensorboard_dir: "checkpoints_v5/runs"